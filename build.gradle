plugins {
    id "java"
    id "application"
    id "antlr"
}
group = "com.arc.mpl"
version = "0.1.0-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    antlr "org.antlr:antlr4:4.13.2"
    compileOnly "org.projectlombok:lombok:1.18.36"
    annotationProcessor "org.projectlombok:lombok:1.18.36"
    implementation "org.slf4j:slf4j-api:2.0.16"
    runtimeOnly "org.slf4j:slf4j-simple:2.0.16"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.18.2"
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testCompileOnly "org.projectlombok:lombok:1.18.36"
    testAnnotationProcessor "org.projectlombok:lombok:1.18.36"
}

application {
    mainClass = "com.arc.mpl.cli.MplCli"
    applicationDefaultJvmArgs = ["-Dfile.encoding=UTF-8"]
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

generateGrammarSource {
    arguments += ["-visitor", "-no-listener"]
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def releaseDirectory = layout.projectDirectory.dir("releases").asFile

tasks.register("releaseCli") {
    dependsOn tasks.named("installDist")
    group = "distribution"
    description = "构建无需 Gradle 前缀即可运行的 MPL CLI 到 releases。"
    doLast {
        def distribution = tasks.named("installDist").get().destinationDir
        if (releaseDirectory.exists()) {
            delete releaseDirectory
        }
        releaseDirectory.mkdirs()
        copy {
            from new File(distribution, "lib")
            into new File(releaseDirectory, "lib")
        }
        def unix = new File(releaseDirectory, "mpl")
        unix.text = """#!/usr/bin/env sh
set -eu
MPL_DIR=\$(CDPATH= cd -- "\$(dirname -- "\$0")" && pwd)
exec java -Dfile.encoding=UTF-8 -cp "\$MPL_DIR/lib/*" com.arc.mpl.cli.MplCli "\$@"
"""
        unix.setExecutable(true, false)
        def windows = new File(releaseDirectory, "mpl.bat")
        windows.text = """@echo off
setlocal
set MPL_DIR=%~dp0
java -Dfile.encoding=UTF-8 -cp "%MPL_DIR%lib/*" com.arc.mpl.cli.MplCli %*
"""
        def versionFile = new File(releaseDirectory, "VERSION")
        versionFile.text = "${project.version}\n"
        def readme = new File(releaseDirectory, "README.txt")
        readme.text = ("MPL CLI ${project.version}\n\n"
            + "Requires Java 17 or newer.\n"
            + "Linux/macOS: ./mpl --version\n"
            + "Windows: mpl.bat --version\n")
        def checksums = new File(releaseDirectory, "SHA256SUMS")
        def files = [unix, windows, versionFile, readme]
        checksums.text = files.collect { file ->
            def digest = java.security.MessageDigest.getInstance("SHA-256")
                .digest(file.bytes).encodeHex().toString()
            "${digest}  ${file.name}"
        }.join("\n") + "\n"
        println "MPL CLI 已生成：${releaseDirectory}"
    }
}

tasks.register("releaseArchive", Zip) {
    dependsOn tasks.named("releaseCli")
    group = "distribution"
    description = "打包包含 Unix 和 Windows 启动器的跨平台 MPL CLI。"
    from releaseDirectory
    exclude("*.zip")
    archiveFileName = "mpl-${project.version}-universal-jdk17.zip"
    destinationDirectory = layout.buildDirectory.dir("release-archives")
    doLast {
        copy {
            from archiveFile
            into releaseDirectory
        }
    }
}

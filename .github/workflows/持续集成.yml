name: 持续集成

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  测试:
    name: Java 17 测试
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 执行测试
        run: ./gradlew --no-daemon clean test

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: 构建官方站点
        working-directory: website
        run: |
          npm ci
          npm run build
